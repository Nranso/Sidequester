<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Quest — Find Your Next Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2 family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ... Keep your existing sidequests CSS styles here ... */

/* Auth UI Overlay Overlays */
#auth-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999;
}
.auth-box {
  background: var(--surface); border: 1px solid var(--border); padding: 2.5rem; border-radius: 16px;
  width: 100%; max-width: 400px; text-align: center;
}
.auth-input {
  width: 100%; padding: 0.85rem; margin: 0.5rem 0; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif;
}
.coffee-btn {
  background: #FFDD00; color: #000000; font-weight: 700; border: none; padding: 0.6rem 1.2rem;
  border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;
}
.top-bar {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;
}
</style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <h2 style="font-family:'Syne'; color:var(--text); margin-bottom:1.5rem;" id="auth-title">Sign In to Side Quest</h2>
    <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
    <input type="password" id="auth-password" class="auth-input" placeholder="Password">
    <button id="auth-submit-btn" class="primary-btn" style="width:100%; margin-top:1rem;">Sign In</button>
    <p style="color:var(--muted); font-size:0.85rem; margin-top:1rem; cursor:pointer;" id="auth-toggle">Don't have an account? Sign Up</p>
  </div>
</div>

<div class="container" id="main-app" style="display:none;">
  <div class="top-bar">
    <a href="YOUR_STRIPE_PAYMENT_LINK_HERE" target="_blank" class="coffee-btn">
      ☕ Buy me a coffee (AUD)
    </a>
    <button id="logout-btn" style="background:transparent; border:1px solid var(--border); color:var(--text); padding:0.5rem 1rem; border-radius:8px; cursor:pointer;">Log Out</button>
  </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // TODO: Replace with your actual Firebase project config snippet
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Authentication UI Interactions
  let isSignUpMode = false;
  const authOverlay = document.getElementById('auth-overlay');
  const mainApp = document.getElementById('main-app');
  const authTitle = document.getElementById('auth-title');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const authToggle = document.getElementById('auth-toggle');

  authToggle.addEventListener('click', () => {
    isSignUpMode = !isSignUpMode;
    authTitle.innerText = isSignUpMode ? "Create an Account" : "Sign In to Side Quest";
    authSubmitBtn.innerText = isSignUpMode ? "Sign Up" : "Sign In";
    authToggle.innerText = isSignUpMode ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
  });

  authSubmitBtn.addEventListener('click', async () => {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    try {
      if (isSignUpMode) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      alert(err.message);
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  // Monitor Auth State Changes
  onAuthStateChanged(auth, (user) => {
    if (user) {
      authOverlay.style.display = 'none';
      mainApp.style.display = 'block';
    } else {
      authOverlay.style.display = 'flex';
      mainApp.style.display = 'none';
    }
  });

  // FIXED CLAUDE FETCH CALL USING PROXY (Bypasses CORS error on Free Domains)
  async function generateQuestAPI(prompt) {
    const ANTHROPIC_API_KEY = 'YOUR_NEW_ANTHROPIC_KEY'; // Replace with a secure key
    const targetUrl = 'https://api.anthropic.com/v1/messages';
    
    // Prefixing with corsproxy.io to allow client-side connection
    const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

    const response = await fetch(proxyUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerously-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-3-5-sonnet-20241022',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      throw new Error(`API Error: ${response.statusText}`);
    }
    return await response.json();
  }

  // Bind your original script handling submission to call generateQuestAPI(prompt)
</script>
</body>
</html>
